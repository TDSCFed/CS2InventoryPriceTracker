name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write       # needed to publish releases
      pull-requests: write  # needed to comment the download link on pull requests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build CS2InventoryPriceTracker/CS2InventoryPriceTracker.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # Refreshes the item names used for storage unit contents (new cases, skins, stickers...).
      # If the source is unreachable, the copy committed in the repository is used.
      - name: Update item data
        continue-on-error: true
        run: python3 tools/generate_item_data.py

      # Every APK is signed with the same key (from repository secrets), so a new build installs over the
      # previous one and keeps the app data (Steam login, cached prices). Without the secrets (e.g. pull requests
      # from forks) the build falls back to a debug key, which needs the old app uninstalled first.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are not set; the APK is signed with a temporary debug key."
            echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cs2inventory.keystore"
          echo "SIGNING_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/cs2inventory.keystore -p:AndroidSigningKeyAlias=cs2inventory -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # Every build gets the next number (the workflow run number), shown in the Account tab.
      # Android only installs an APK over another with the same or a higher number, so newer builds always update.
      - name: Set version
        run: |
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # Debug build with assemblies embedded, so the APK installs and runs standalone on a phone.
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet build CS2InventoryPriceTracker/CS2InventoryPriceTracker.csproj
          -c Debug
          -f net10.0-android
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:ApplicationVersion=$APP_VERSION_CODE
          -p:ApplicationDisplayVersion=$APP_VERSION
          $SIGNING_ARGS

      # archive: false uploads the APK as-is (not wrapped in a zip), so it can be
      # downloaded from the run page and installed directly.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: CS2InventoryPriceTracker/bin/Debug/net10.0-android/*-Signed.apk
          archive: false
          if-no-files-found: error

      # Builds of main are also published as a release called "latest" (replaced on every build),
      # so the APK has one fixed, easy download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/CS2InventoryPriceTracker.apk
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp CS2InventoryPriceTracker/bin/Debug/net10.0-android/*-Signed.apk CS2InventoryPriceTracker.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest CS2InventoryPriceTracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($APP_VERSION)" \
            --notes "Version $APP_VERSION, built from commit ${GITHUB_SHA::7}"

      # Pull request builds are published as a pre-release called "pr-<number>" (replaced on every
      # push to the PR), and the download link is posted as a comment on the PR.
      - name: Publish PR build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="pr-$PR_NUMBER"
          FILE="CS2InventoryPriceTracker-pr-$PR_NUMBER.apk"
          cp CS2InventoryPriceTracker/bin/Debug/net10.0-android/*-Signed.apk "$FILE"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Build of PR #$PR_NUMBER ($APP_VERSION)" \
            --notes "Version $APP_VERSION, built from commit ${HEAD_SHA::7}"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "APK for this PR (version $APP_VERSION, commit ${HEAD_SHA::7}): https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
